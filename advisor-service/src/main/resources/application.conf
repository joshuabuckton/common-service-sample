akka.javasdk.dev-mode.http-port = 9001

# Token that advisor-service sends to preferences-service. The preferences service requires a bearer
# token from every caller, and records the token subject in its audit history. This value is for
# local runs only. Local runs do not check the signature.
advisor.preferences-token = "eyJhbGciOiJub25lIn0.eyJpc3MiOiJwcmVmZXJlbmNlcy1jYWxsZXJzIiwic3ViIjoiYWR2aXNvci1zZXJ2aWNlIn0."

# Deployed services set the token through the environment.
advisor.preferences-token = ${?ADVISOR_PREFERENCES_TOKEN}

# Local runs: reach the preferences service on this machine without TLS.
akka.javasdk.grpc.client."preferences-service" {
  host = "localhost"
  port = 9000
  use-tls = false
}
