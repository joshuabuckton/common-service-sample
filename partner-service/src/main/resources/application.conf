akka.javasdk.dev-mode.http-port = 9002

# The public address of the preferences service in the other project, and the token to send.
# Replace both for a deployed service. The token below is for local runs only, where the
# signature is not checked.
partner.preferences-host = "preferences.local.example"
partner.preferences-token = "eyJhbGciOiJub25lIn0.eyJpc3MiOiJwcmVmZXJlbmNlcy1jYWxsZXJzIiwic3ViIjoicGFydG5lci0xIn0."

# Deployed services set both through the environment.
partner.preferences-host = ${?PARTNER_PREFERENCES_HOST}
partner.preferences-token = ${?PARTNER_PREFERENCES_TOKEN}

# Local runs: the fake address above reaches the preferences service on this machine without TLS.
akka.javasdk.grpc.client."preferences.local.example" {
  host = "localhost"
  port = 9000
  use-tls = false
}
